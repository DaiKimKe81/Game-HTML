<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thợ Săn Thẻ</title>
<style>
:root{--open:#1d4ed8;--close:#c62828;--self:#b45309;--text:#111;--bg:#f6f7fb;--card:#fff;--ok:#15803d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#111;font-size:18px}
body.big{font-size:24px}
header{background:#1e293b;color:#fff;padding:18px 14px 12px;text-align:center}
header h1{font-size:2.3em;margin:0 0 6px;font-weight:800;letter-spacing:.5px;color:#fde047;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:6px}
#st{font-size:1.05em;font-weight:700;background:#334155;border:2px solid #64748b;border-radius:999px;padding:4px 16px;color:#fff}
button{font:inherit;min-height:44px;padding:6px 14px;border-radius:10px;border:2px solid #334155;background:#fff;color:#111;cursor:pointer}
button.pri{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
button.sm{min-height:38px;padding:4px 10px;font-size:.85em}
header button{background:#334155;color:#fff;border-color:#475569}
main{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#task{font-weight:800;font-size:1.3em;text-align:center;line-height:1.4;background:#fff8d6;border:3px solid #f59e0b;border-radius:12px;padding:14px;margin-bottom:12px}
#code{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:1em;line-height:2.1}
.ln{display:block;white-space:pre-wrap}
.n{display:inline-block;width:1.8em;color:#999;text-align:right;margin-right:.6em;user-select:none;font-size:.8em}
.tk{display:inline;padding:3px 2px;border-radius:6px;border:2px solid transparent;cursor:pointer;margin:0 1px;-webkit-tap-highlight-color:transparent}
.tk.sel{background:#fde68a;border-color:#f59e0b}
.tk.ans{outline:3px dashed #7c3aed}
.tk.c-open{background:#dbe7ff;color:var(--open);border-color:var(--open)}
.tk.c-close{background:#ffe0e0;color:var(--close);border-color:var(--close)}
.tk.c-self{background:#ffecc7;color:var(--self);border-color:var(--self)}
.tk.c-text{background:#e5e5e5;color:#111;border-color:#555}
.tk.c-other{background:#efe1ff;color:#6d28d9;border-color:#6d28d9}
.tk.grp{text-decoration:underline wavy #15803d;text-underline-offset:5px}
.tk.ans{outline:3px dashed #7c3aed}
.tk.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.note{font-size:.85em;margin:4px 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:.95em;margin:8px 0 12px}
.legend span{padding:4px 12px;border-radius:999px;border:2px solid;transition:opacity .2s}
.legend span.on{font-weight:800;color:#000!important;background:#8ec5ff;border-color:#2563eb!important;box-shadow:0 0 0 3px #bfdbfe}
.legend span.off{opacity:.28}
#msg{min-height:3.4em;margin:12px 0;padding:12px 14px;font-size:1.05em;text-align:center;border-radius:10px;background:#eef2f7}
#msg.good{background:#dcfce7;color:#14532d}
#msg.bad{background:#fff1f2;color:#7f1d1d}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
iframe{width:100%;height:260px;border:2px solid #cbd5e1;border-radius:10px;background:#fff}
#score{font-weight:700}
.team{padding:2px 10px;border-radius:999px;background:#334155;color:#fff;font-size:.85em}
.team.on{background:#facc15;color:#111}
#end{display:none;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
  <h1>🔎 THỢ SĂN THẺ</h1>
  <div style="opacity:.9">Săn thẻ HTML trong trang web</div>
  <div class="bar">
    <span id="st"></span>
    <span id="score">Điểm: 0</span>
    <span id="teams" style="display:none"></span>
    <button id="bTeam" class="sm">Chế độ 2 đội</button>
    <button id="bBig" class="sm">Chữ to</button>
    <button id="bSnd" class="sm">🔇 Âm thanh</button>
    <button id="bReset" class="sm">Chơi lại</button>
  </div>
</header>
<main id="game">
  <section class="panel">
    <div id="task"></div>
    <div class="legend">
      <span data-k="open" style="border-color:var(--open);color:var(--open)">Thẻ MỞ</span>
      <span data-k="close" style="border-color:var(--close);color:var(--close)">Thẻ ĐÓNG</span>
      <span data-k="self" style="border-color:var(--self);color:var(--self)">Thẻ ĐƠN</span>
      <span data-k="text" style="border-color:#555">NỘI DUNG</span>
      <span data-k="other" style="border-color:#6d28d9;color:#6d28d9">Không phải phần tử</span>
    </div>
    <div id="code"></div>
  </section>
  <section class="panel">
    <div class="row">
      <button id="bCheck" class="pri">Kiểm tra</button>
      <button id="bClear">Bỏ chọn</button>
      <button id="bAns">Xem đáp án</button>
      <button id="bNext" class="pri" style="display:none">Vòng tiếp ▶</button>
    </div>
    <div id="msg">Chạm vào các mảnh mã để chọn, rồi bấm "Kiểm tra".</div>
    <b>Kết quả trên trình duyệt:</b>
    <iframe id="prev" sandbox="allow-same-origin" title="Kết quả trang web"></iframe>
  </section>
</main>
<div id="end" class="panel"></div>

<script>
// ===== DỮ LIỆU MÀN CHƠI (dễ sửa) =====
// type: open | close | self | text | doctype | comment
var selMap = {};
function o(t,el,sel){selMap[el]=sel;return {t:t,type:'open',el:el};}
function c(t,el){return {t:t,type:'close',el:el};}
function s(t,el,sel){selMap[el]=sel;return {t:t,type:'self',el:el};}
function x(t,el){return {t:t,type:'text',el:el};}
function d(t){return {t:t,type:'doctype',el:'doctype'};}
function m(t){return {t:t,type:'comment',el:'comment'};}
var LINES = [
 {i:0,k:[d('<!DOCTYPE html>')]},
 {i:0,k:[o('<html lang="vi">','html','html')]},
 {i:1,k:[o('<head>','head','head')]},
 {i:2,k:[s('<meta charset="UTF-8">','meta','meta')]},
 {i:2,k:[o('<title>','title','title'),x('Bản em','title'),c('</title>','title')]},
 {i:1,k:[c('</head>','head')]},
 {i:1,k:[o('<body>','body','body')]},
 {i:2,k:[m('<!-- Trang giới thiệu bản em -->')]},
 {i:2,k:[o('<h1>','h1','h1'),x('Chào mừng đến bản em','h1'),c('</h1>','h1')]},
 {i:2,k:[o('<p>','p1','body > p:nth-of-type(1)'),x('Bản em nằm trên sườn núi, quanh năm mây phủ.','p1'),c('</p>','p1')]},
 {i:2,k:[s('<hr/>','hr','hr')]},
 {i:2,k:[o('<p>','p2','body > p:nth-of-type(2)'),x('Mùa xuân, hoa mơ hoa mận nở trắng.','p2'),s('<br/>','br','br'),x('Mời mọi người đến chơi nhé!','p2'),c('</p>','p2')]},
 {i:1,k:[c('</body>','body')]},
 {i:0,k:[c('</html>','html')]}
];
var ROUNDS = [
 {chips:["open"],ask:'Chạm vào TẤT CẢ THẺ MỞ (có dạng <tên thẻ>)',perm:'c-open',pick:function(t){return t.type==='open';},
  tip:'Thẻ mở KHÔNG có dấu gạch chéo "/". Thẻ đơn như <hr/> cũng không tính ở vòng này.',
  why:'Đúng! Thẻ mở bắt đầu một phần tử. Có 7 thẻ mở.'},
 {chips:["close"],ask:'Chạm vào TẤT CẢ THẺ ĐÓNG (có dạng </tên thẻ>)',perm:'c-close',pick:function(t){return t.type==='close';},
  tip:'Thẻ đóng có dấu gạch chéo "/" đứng ngay sau dấu "<".',
  why:'Đúng! Mỗi thẻ đóng "đóng cửa" cho thẻ mở cùng tên. Có 7 thẻ đóng.'},
 {chips:["self"],ask:'Chạm vào TẤT CẢ THẺ ĐƠN (không có thẻ đóng đi kèm)',perm:'c-self',pick:function(t){return t.type==='self';},
  tip:'Thẻ đơn đứng một mình: không bao quanh nội dung nào. Ví dụ ngắt dòng, đường kẻ ngang.',
  why:'Đúng! <meta>, <hr/>, <br/> là thẻ đơn: không có thẻ đóng.'},
 {chips:["text"],ask:'Chạm vào TẤT CẢ NỘI DUNG (chữ mà người xem đọc được trên trang)',perm:'c-text',pick:function(t){return t.type==='text';},
  tip:'Nội dung nằm GIỮA thẻ mở và thẻ đóng. Chữ trong <title> cũng là nội dung.',
  why:'Đúng! Nội dung nằm giữa thẻ mở và thẻ đóng.'},
 {chips:["open","text","close"],ask:'Chọn TRỌN phần tử tiêu đề h1: thẻ mở + nội dung + thẻ đóng',hl:'h1',pick:function(t){return t.el==='h1';},
  tip:'Một phần tử = thẻ mở + nội dung + thẻ đóng. Cần chọn đủ 3 mảnh.',
  why:'Đúng! Phần tử h1 gồm 3 mảnh. Nhìn bên phải: đó là dòng tiêu đề lớn.'},
 {chips:["open","text","close"],ask:'Chọn TRỌN phần tử <title> (trong phần đầu của trang)',hl:'title',pick:function(t){return t.el==='title';},
  tip:'Tìm phần tử nằm trong <head>. Cần đủ thẻ mở, nội dung, thẻ đóng.',
  why:'Đúng! <title> hiện ở thanh tab của trình duyệt, không hiện trong trang.'},
 {chips:["open","text","close"],ask:'Chọn TRỌN phần tử đoạn văn đầu tiên <p>',hl:'p1',pick:function(t){return t.el==='p1';},
  tip:'Đoạn văn đầu nằm ngay dưới tiêu đề h1. Cần 3 mảnh.',
  why:'Đúng! Đoạn văn đầu có 3 mảnh.'},
 {chips:["self"],ask:'Chọn phần tử đường kẻ ngang <hr/> (thẻ đơn: chỉ có 1 mảnh)',hl:'hr',pick:function(t){return t.el==='hr';},
  tip:'Phần tử chỉ gồm thẻ đơn thì chỉ cần chọn đúng thẻ đó.',
  why:'Đúng! Phần tử chỉ gồm một thẻ đơn.'},
 {chips:["other"],ask:'BẪY! Chạm vào những dòng KHÔNG phải là phần tử HTML',perm:'c-other',pick:function(t){return t.type==='doctype'||t.type==='comment';},
  tip:'Có 2 thứ trông giống thẻ nhưng không phải phần tử: dòng khai báo ở đầu tệp và dòng ghi chú.',
  why:'Đúng! <!DOCTYPE html> chỉ khai báo loại tệp, còn <!-- ... --> là chú thích: cả hai không phải phần tử.'}
];

// ===== TRẠNG THÁI =====
var tokens=[], el={}, ri=0, sel={}, tries=0, score=0, team=0, teamScore=[0,0], teamMode=false, snd=false, locked=false;
function $(i){return document.getElementById(i);}
function srcdoc(){
  var out=[];
  LINES.forEach(function(L){var line='';L.k.forEach(function(t){line+=t.t;});out.push(new Array(L.i*2+1).join(' ')+line);});
  return out.join('\n');
}
function build(){
  var h='', n=0;
  tokens=[];
  LINES.forEach(function(L,li){
    h+='<span class="ln"><span class="n">'+(li+1)+'</span>'+new Array(L.i*2+1).join(' ');
    L.k.forEach(function(t){
      t.idx=tokens.length;tokens.push(t);
      h+='<span class="tk" data-i="'+t.idx+'" title="">'+esc(t.t)+'</span>';
    });
    h+='</span>';
  });
  $('code').innerHTML=h;
  $('prev').srcdoc=srcdoc();
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function node(i){return $('code').querySelector('[data-i="'+i+'"]');}
function target(){var r=ROUNDS[ri],a={};tokens.forEach(function(t){if(r.pick(t))a[t.idx]=1;});return a;}
function showRound(){
  var r=ROUNDS[ri];
  $('st').textContent='Vòng '+(ri+1)+'/'+ROUNDS.length+(teamMode?' · lượt '+teamName(team):'');
  $('task').textContent=r.ask;
  setChips(r.chips);
  sel={};tries=0;locked=false;
  refresh();
  $('bNext').style.display='none';$('bCheck').style.display='';
  say('Chạm vào các mảnh mã để chọn, rồi bấm "Kiểm tra".','');
  highlight(null);
}
function refresh(){
  tokens.forEach(function(t){var n=node(t.idx);n.classList.toggle('sel',!!sel[t.idx]);n.classList.remove('ans');});
}
function setChips(keys){
  var cs=document.querySelectorAll('.legend span');
  for(var i=0;i<cs.length;i++){var on=keys.indexOf(cs[i].getAttribute('data-k'))>=0;cs[i].className=on?'on':'off';}
}
function say(txt,cls){var m=$('msg');m.textContent=txt;m.className=cls||'';m.id='msg';}
function highlight(selector){
  try{
    var doc=$('prev').contentDocument;if(!doc)return;
    var old=doc.querySelectorAll('[data-hl]');
    for(var i=0;i<old.length;i++){old[i].style.outline='';old[i].style.background='';old[i].removeAttribute('data-hl');}
    if(selector){var e=doc.querySelector(selector);if(e){e.style.outline='4px solid #f59e0b';e.style.background='#fef3c7';e.setAttribute('data-hl','1');}}
  }catch(e){}
}
function beep(f,len){
  if(!snd)return;
  try{var A=window.AudioContext||window.webkitAudioContext;var a=new A(),o=a.createOscillator(),g=a.createGain();
    o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();setTimeout(function(){o.stop();a.close();},len);}catch(e){}
}
function teamName(i){return i===0?'Đội 1':'Đội 2';}
function drawScore(){
  $('score').textContent=teamMode?'':'Điểm: '+score;
  var tm=$('teams');tm.style.display=teamMode?'inline':'none';
  if(teamMode){tm.innerHTML=[0,1].map(function(i){return '<span class="team'+(team===i?' on':'')+'">'+teamName(i)+': '+teamScore[i]+'</span>';}).join(' ');}
}
function check(){
  if(locked)return;
  var r=ROUNDS[ri],T=target(),miss=0,extra=0,k;
  for(k in T)if(!sel[k])miss++;
  for(k in sel)if(!T[k])extra++;
  tries++;
  if(!miss&&!extra){
    var n=Object.keys(T).length, pts=10*n+(tries===1?20:0);
    score+=pts;teamScore[team]+=pts;
    for(k in T){var nd=node(k);nd.classList.remove('sel');
      if(r.perm)nd.classList.add(r.perm);else nd.classList.add('grp');}
    sel={};
    highlight(r.hl?selMap[r.hl]:null);
    say('✔ '+r.why+'  (+'+pts+' điểm'+(tries===1?', thưởng làm đúng ngay lần đầu':'')+')','good');
    beep(880,180);locked=true;
    $('bCheck').style.display='none';$('bNext').style.display='';
    $('bNext').textContent=(ri===ROUNDS.length-1)?'Xem kết quả ▶':'Vòng tiếp ▶';
    drawScore();
  }else{
    var t=[];
    if(miss)t.push('còn thiếu '+miss+' mảnh');
    if(extra)t.push('có '+extra+' mảnh chưa đúng');
    say('Chưa đúng: '+t.join(', ')+'. Gợi ý: '+r.tip+' Em thử lại nhé, không bị trừ điểm.','bad');
    beep(220,150);
    for(k in sel)if(!T[k]){var nd2=node(k);nd2.classList.add('shake');(function(n){setTimeout(function(){n.classList.remove('shake');},350);})(nd2);}
  }
}
function next(){
  if(ri===ROUNDS.length-1){finish();return;}
  ri++;
  if(teamMode)team=1-team;
  drawScore();showRound();
}
function finish(){
  $('game').style.display='none';
  var e=$('end');e.style.display='block';
  var res=teamMode?(teamScore[0]===teamScore[1]?'Hòa nhau!':(teamScore[0]>teamScore[1]?'Đội 1 thắng!':'Đội 2 thắng!'))+'<br>Đội 1: '+teamScore[0]+' · Đội 2: '+teamScore[1]:'Tổng điểm: '+score;
  e.innerHTML='<h2>🎉 Hoàn thành!</h2><p style="font-size:1.3em">'+res+'</p>'+
   '<p><b>Ghi nhớ:</b> phần tử HTML = thẻ mở + nội dung + thẻ đóng. Thẻ đơn đứng một mình. DOCTYPE và chú thích không phải phần tử.</p>'+
   '<button class="pri" onclick="reset()">Chơi lại</button>';
}
function reset(){
  ri=0;score=0;teamScore=[0,0];team=0;locked=false;
  $('end').style.display='none';$('game').style.display='grid';
  build();drawScore();showRound();
}
$('code').addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('.tk'):null;if(!t||locked)return;
  var i=t.getAttribute('data-i');
  if(sel[i])delete sel[i];else sel[i]=1;
  t.classList.toggle('sel',!!sel[i]);
});
$('bCheck').onclick=check;
$('bNext').onclick=next;
$('bClear').onclick=function(){if(locked)return;sel={};refresh();};
$('bAns').onclick=function(){
  if(locked)return;var T=target();refresh();
  for(var k in T)node(k).classList.add('ans');
  say('Các mảnh viền tím nét đứt là đáp án. Hãy chạm chọn chúng để hoàn thành vòng.','');
};
$('bBig').onclick=function(){document.body.classList.toggle('big');};
$('bSnd').onclick=function(){snd=!snd;$('bSnd').textContent=snd?'🔊 Âm thanh':'🔇 Âm thanh';beep(660,120);};
$('bTeam').onclick=function(){teamMode=!teamMode;$('bTeam').textContent=teamMode?'Chơi 1 mình':'Chế độ 2 đội';score=0;teamScore=[0,0];team=0;drawScore();showRound();};
$('bReset').onclick=reset;
$('prev').addEventListener('load',function(){var r=ROUNDS[ri];if(locked&&r&&r.hl)highlight(selMap[r.hl]);});
build();drawScore();showRound();
</script>
</body>
</html>
